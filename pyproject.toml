[project]
name = "GPDP"
description = "Google Play Download Proxy"
readme = "README.md"
requires-python = ">= 3.14"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
dependencies = [
  "asyncio",
  "bleach",
  "fastapi",
  "httpx",
  "jinja2",
  "jproperties",
  "protobuf",
  "pydantic",
  "python-multipart",
  "uvicorn",
]
dynamic = ["version"]

[[project.authors]]
name = "opekope2"

[project.urls]
Homepage = "https://github.com/opekope2/GPDP"
Issues = "https://github.com/opekope2/GPDP/issues"
Repository = "https://github.com/opekope2/GPDP"

[project.optional-dependencies]
dev = [
  "build",
  "pyrefly",
  "ruff",
  "types-bleach",
  "types-protobuf",
  "types-setuptools",
]
protobuf = ["grpcio-tools"]

[build-system]
requires = ["grpcio-tools", "setuptools"]
build-backend = "setuptools.build_meta"

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
search-path = ["src"]
preset = "strict"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort import sorting
  "UP",  # modernize Python syntax
]

[tool.ruff.lint.isort]
known-first-party = ["gpdp"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version.attr = "gpdp.__version__"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpdp = [
  "assets/**/*",
  "proto/*.py",
  "templates/*",
]
